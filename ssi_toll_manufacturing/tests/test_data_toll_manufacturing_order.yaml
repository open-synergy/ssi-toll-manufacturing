scenarios:
  - name: "Toll Manufacturing Order - Full Workflow draft to open"
    steps:
      - step: "Setup - create order type"
        action: "create"
        model: "toll_manufacturing_order_type"
        save_as: "order_type"
        values:
          name: "TMO Test Type Workflow"
          code: "TMOTYPWF"

      - step: "Setup - create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test TMO Partner WF"

      - step: "Setup - get UoM unit"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test TMO Product WF"
          type: "product"
          uom_id: "EVAL: registry['uom'].id"
          uom_po_id: "EVAL: registry['uom'].id"

      - step: "Create toll manufacturing order"
        action: "create"
        model: "toll_manufacturing_order"
        save_as: "order"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['order_type'].id"
          partner_id: "EVAL: registry['partner'].id"
          product_id: "EVAL: registry['product'].id"
          uom_id: "EVAL: registry['uom'].id"
          uom_quantity: 100.0

      - step: "Assert order created in draft"
        action: "assert"
        target: "order"
        asserts:
          state:
            type: "value"
            expected: "draft"
          amount_total:
            type: "value"
            expected: 0.0
          amount_untaxed:
            type: "value"
            expected: 0.0
          amount_tax:
            type: "value"
            expected: 0.0
          amount_processing_fee:
            type: "value"
            expected: 0.0
          amount_supplier_procured_raw_material:
            type: "value"
            expected: 0.0
          qty_accepted:
            type: "value"
            expected: 0.0

      - step: "Confirm order"
        action: "call"
        target: "order"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "order"
        method: "invalidate_cache"

      - step: "Approve order to open"
        action: "call"
        target: "order"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "order"
        method: "invalidate_cache"

      - step: "Assert qty_diff after open"
        action: "assert"
        target: "order"
        asserts:
          qty_accepted:
            type: "value"
            expected: 0.0
          qty_diff:
            type: "value"
            expected: -100.0

  - name: "Toll Manufacturing Order - Compute Amounts with Customer Supplied RM"
    steps:
      - step: "Setup - create order type"
        action: "create"
        model: "toll_manufacturing_order_type"
        save_as: "order_type"
        values:
          name: "TMO Compute Type"
          code: "TMOCOMP01"

      - step: "Setup - create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test TMO Compute Partner"

      - step: "Setup - get UoM unit"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Setup - create finished product"
        action: "create"
        model: "product.product"
        save_as: "fg_product"
        values:
          name: "Test TMO FG Product"
          type: "product"
          uom_id: "EVAL: registry['uom'].id"
          uom_po_id: "EVAL: registry['uom'].id"

      - step: "Setup - create raw material product"
        action: "create"
        model: "product.product"
        save_as: "rm_product"
        values:
          name: "Test TMO RM Product"
          type: "product"
          uom_id: "EVAL: registry['uom'].id"
          uom_po_id: "EVAL: registry['uom'].id"

      - step: "Create order with customer RM"
        action: "create"
        model: "toll_manufacturing_order"
        save_as: "order"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['order_type'].id"
          partner_id: "EVAL: registry['partner'].id"
          product_id: "EVAL: registry['fg_product'].id"
          uom_id: "EVAL: registry['uom'].id"
          uom_quantity: 50.0
          customer_supplied_raw_material_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['rm_product'].id"
                name: "Customer RM Line"
                uom_id: "EVAL: registry['uom'].id"
                uom_quantity: 200.0

      - step: "Assert customer RM line added"
        action: "assert"
        target: "order"
        asserts:
          customer_supplied_raw_material_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
